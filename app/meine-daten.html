<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meine Daten · stencil.me</title>
<link href="/vendor/fonts/fonts.css" rel="stylesheet">
<link href="/app/core/werkstatt.css" rel="stylesheet">
<style>
  .daten-bilder { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 12px; }
  .daten-bilder img { height:110px; border:2px solid var(--ink); background:#fff; }
  .daten-station { border-top:2px solid var(--ink); padding-top:10px; margin-top:14px; }
  .daten-station h3 { margin:0 0 6px; font-size:1rem; }
  .daten-station p { margin:4px 0; }
  .zeiten { border-collapse:collapse; width:100%; font-size:.9rem; margin:6px 0 12px; }
  .zeiten th, .zeiten td { border-bottom:1px solid var(--ink); padding:4px 6px; text-align:left; }
  .zeiten td.zahl { text-align:right; font-variant-numeric:tabular-nums; }
  .auswerten { background:#fffbe6; border:3px solid var(--ink); padding:10px 12px; }
  .auswerten li { margin:4px 0; }
  .daten-station pre { white-space:pre-wrap; font-size:.8rem; max-height:240px; overflow:auto; background:#fff; border:1px solid var(--ink); padding:6px; }
</style>
</head>
<body>
<!-- „Meine Daten“: was auf diesem iPad und auf Pennys Laptop über die eigene Gruppe gespeichert ist.
     Der Laptop gibt nur die Daten der Gruppe heraus, deren zufällige ID dieses iPad kennt. -->
<main id="inhalt"><section class="panel"><p>Wird geladen …</p></section></main>
<div class="fehler" id="fehler" role="alert" hidden></div>
<script src="/app/core/speicher.js"></script>
<script src="/app/core/outbox.js"></script>
<script src="/app/core/stationen.js"></script>
<script src="/app/core/rahmen.js"></script>
<script>
(function(){
  const el = Rahmen.el;
  const KI_TEXT = { generativ: 'Generative KI', ki: 'Bildbearbeitungs-KI', programm: 'Keine KI, nur ein Programm', analog: 'Ohne Computer', 'weiss-nicht': 'Weiß nicht' };
  const FELDER = { 'svg-code': 'Euer SVG-Code', 'html-code': 'Euer HTML-Code', quiz: 'Quiz', auftraege: 'Eure Aufträge an Claude', feedback: 'Feedbackbogen' };
  const inhalt = document.getElementById('inhalt');

  function bilder(urls){
    return el('div', { klasse: 'daten-bilder' }, urls.map(u => el('img', { src: u, alt: '' })));
  }

  function wert(liste, station, key, w){
    if(key === 'feedback' && Array.isArray(w)){
      const fragen = (station && station.feedback) || [];
      return el('div', {}, w.map(person => el('p', {}, [el('strong', { text: person.name + ': ' }),
        el('span', { text: fragen.filter(f => person[f.id]).map(f => f.text + ' ' + (f.art === 'station' ? titel(liste, person[f.id]) : person[f.id])).join(' · ') })])));
    }
    if(Array.isArray(w)) w = w.join(' · ');
    if(key === 'svg-code' || key === 'html-code') return el('details', {}, [el('summary', { text: 'Code ansehen' }), el('pre', { text: String(w) })]);
    return el('span', { text: String(w) });
  }

  function uhrzeit(iso){
    if(!iso) return '–';
    const d = new Date(iso);
    return isNaN(d) ? '–' : ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // Wann wart ihr an welcher Station? zeiten: { station: { start, ende, minuten } }
  function zeitTabelle(liste, zeiten){
    const ids = liste.map(s => s.id).filter(id => zeiten[id] && (zeiten[id].start || zeiten[id].ende));
    if(!ids.length) return el('p', { text: 'Noch keine.' });
    let summe = 0;
    const zeilen = ids.map(id => {
      const z = zeiten[id];
      if(z.minuten) summe += z.minuten;
      return el('tr', {}, [el('td', { text: titel(liste, id) }), el('td', { text: uhrzeit(z.start) }), el('td', { text: uhrzeit(z.ende) }),
        el('td', { klasse: 'zahl', text: z.minuten != null ? String(Math.round(z.minuten)) : '–' })]);
    });
    zeilen.push(el('tr', {}, [el('td', {}, [el('strong', { text: 'Zusammen' })]), el('td'), el('td'), el('td', { klasse: 'zahl' }, [el('strong', { text: String(Math.round(summe)) })])]));
    return el('table', { klasse: 'zeiten' }, [
      el('thead', {}, [el('tr', {}, ['Station', 'Start', 'Fertig', 'Minuten'].map(t => el('th', { text: t })))]),
      el('tbody', {}, zeilen)
    ]);
  }

  // Erlebnis (Patricia, 25.10.): Wie viele Daten erzeuge ich in einem Workshop, und was ließe sich daraus ablesen?
  function auswertenTeil(liste, f){
    const stationen = Object.keys(f.stationen || {}).filter(id => (f.stationen[id] || {}).status);
    let antworten = 0, zeitpunkte = 0, klicks = 0;
    stationen.forEach(id => {
      const e = f.stationen[id];
      antworten += Object.keys(e.antworten || {}).filter(k => e.antworten[k]).length;
      zeitpunkte += (e.start ? 1 : 0) + (e.ende ? 1 : 0);
      klicks += (e.kiTyp ? 1 : 0) + (e.sterne ? 1 : 0) + (e.quiz ? Object.keys(e.quiz).length : 0) + (e.aufgaben ? Object.keys(e.aufgaben).length : 0);
    });
    return el('section', { klasse: 'panel' }, [
      el('h1', { text: '🔎 Was man aus euren Daten ablesen könnte' }),
      el('p', { text: 'In diesem Workshop habt ihr bisher ' + stationen.length + ' Stationen besucht und dabei ' + zeitpunkte + ' Zeitpunkte, ' +
        antworten + ' Textantworten und ' + klicks + ' Auswahl-Klicks (Sterne, KI-Frage, Quiz, Aufgaben) erzeugt. Dazu kommen eure Fotos.' }),
      el('div', { klasse: 'auswerten' }, [
        el('p', {}, [el('strong', { text: 'Wer alle diese Daten hat, könnte zum Beispiel auswerten:' })]),
        el('ul', {}, [
          'wann ihr wo wart und wie lange ihr für jede Station gebraucht habt, auch im Vergleich zu anderen Gruppen,',
          'welche Station euch gefallen hat und welche nicht (Sterne),',
          'ob ihr Programm, KI und generative KI unterscheiden könnt (KI-Frage),',
          'was ihr denkt (eure Antworten, zum Beispiel zu KI und Ethik), welchen Beruf ihr euch wünscht,',
          'wie ihr ausseht: Auf euren Fotos erkennt man euch, und eine KI könnte daraus mehr schätzen, zum Beispiel Alter oder Stimmung.'
        ].map(t => el('li', { text: t })))
      ]),
      el('p', { text: 'Darum wertet Penny nur ohne Namen aus: Sterne, KI-Frage, Zeiten und Feedback, um den Workshop zu verbessern. Am Ende wird alles gelöscht. Nur die Apps aus dem Vibe Coding hebt Penny ohne Namen auf.' })
    ]);
  }

  function titel(liste, id){
    const st = liste.filter(s => s.id === id)[0];
    return st ? st.titel : id;
  }

  function stationZeigen(liste, id, daten){
    const st = liste.filter(s => s.id === id)[0];
    const teile = [el('h3', { text: titel(liste, id) })];
    const antworten = daten.antworten || {};
    Object.keys(antworten).forEach(key => {
      if(antworten[key] === '' || antworten[key] == null) return;
      const eingabe = ((st && st.eingaben) || []).filter(e => e.id === key)[0];
      teile.push(el('p', {}, [el('strong', { text: (eingabe ? eingabe.text : (FELDER[key] || key)) + ' ' }), wert(liste, st, key, antworten[key])]));
    });
    if(daten.kiTyp) teile.push(el('p', { text: 'Eure Antwort auf die KI-Frage: ' + (KI_TEXT[daten.kiTyp] || daten.kiTyp) }));
    if(daten.sterne) teile.push(el('p', { text: 'Sterne: ' + '★★★★★'.slice(0, daten.sterne) + '☆☆☆☆☆'.slice(0, 5 - daten.sterne) }));
    return el('div', { klasse: 'daten-station' }, teile);
  }

  function laptopTeil(gruppe, liste){
    const box = el('section', { klasse: 'panel' }, [
      el('h1', { text: '💻 Auf Pennys Laptop' }),
      el('p', { klasse: 'hinweis', text: 'Das hat dein iPad an den Laptop geschickt. Nur Penny sieht es. Am Ende des Workshops wird alles gelöscht.' })
    ]);
    const warte = el('p', { text: 'Frage den Laptop …' });
    box.appendChild(warte);
    fetch('/api/meine-daten?gruppe=' + gruppe.id, { cache: 'no-store' })
      .then(r => { if(!r.ok) throw new Error('Status ' + r.status); return r.json(); })
      .then(d => {
        box.removeChild(warte);
        box.appendChild(el('p', {}, [el('strong', { text: 'Eure Namen: ' }), el('span', { text: d.personen.join(' und ') || '–' })]));
        const url = datei => '/api/meine-datei?gruppe=' + gruppe.id + '&datei=' + encodeURIComponent(datei);
        const bildDateien = d.dateien.filter(f => /\.(jpg|png|svg)$/.test(f));
        const apps = d.dateien.filter(f => /\.html$/.test(f));
        box.appendChild(el('h2', { text: 'Fotos, Stempel und Bilder (' + bildDateien.length + ')' }));
        box.appendChild(bildDateien.length ? bilder(bildDateien.map(url)) : el('p', { text: 'Noch keine.' }));
        if(apps.length) box.appendChild(el('p', { text: 'Dazu ' + apps.length + (apps.length === 1 ? ' App' : ' Apps') + ' aus „Bild-App vibe coden“.' }));
        box.appendChild(el('h2', { text: 'Wann ihr wo wart' }));
        box.appendChild(zeitTabelle(liste, d.zeiten || {}));
        box.appendChild(el('h2', { text: 'Eure Antworten' }));
        if(!Object.keys(d.antworten).length) box.appendChild(el('p', { text: 'Noch keine.' }));
        d.fertig.forEach(id => box.appendChild(stationZeigen(liste, id, d.antworten[id] || {})));
      })
      .catch(err => {
        console.error(err);
        warte.textContent = 'Der Laptop ist gerade nicht erreichbar. Was noch nicht angekommen ist, liegt sicher auf dem iPad.';
      });
    return box;
  }

  // Abschluss: Erst wenn der Laptop es freigibt (oder mit ?test), können die Kinder alles auf dem
  // iPad löschen. Vorher sollte alles beim Laptop sein, sonst fehlt es in Pennys Auswertung.
  function loeschenTeil(){
    const box = el('section', { klasse: 'panel' }, [
      el('h1', { text: '🗑 Alles auf diesem iPad löschen' }),
      el('p', { text: 'Der Workshop ist vorbei. Mit nach Hause nehmt ihr Stempel, Postkarte und Sticker. Auf dem iPad und auf Pennys Laptop wird jetzt alles gelöscht.' }),
      el('p', { text: 'Wenn ihr löscht, sind eure Namen, Fotos und Antworten auf diesem iPad weg. Die nächste Gruppe sieht nichts von euch.' }),
      el('p', { klasse: 'rand-warnung', text: 'Bitte schließt vorher in Safari alle anderen Tabs außer diesem (Tab-Übersicht: Symbol mit den zwei Kästchen, dann bei jedem Tab auf ✕).' })
    ]);
    const status = el('p', { klasse: 'hinweis' });
    const knopf = el('button', { type: 'button', klasse: 'gross', text: '🗑 Jetzt alles löschen' });
    const trotzdem = el('button', { type: 'button', klasse: 'secondary', text: 'Trotzdem löschen' });
    trotzdem.hidden = true;

    // Wartet höchstens ms Millisekunden, dann geht es mit 'zeit' weiter (nie hängen bleiben)
    function hoechstens(promise, ms){
      return Promise.race([promise, new Promise(resolve => setTimeout(() => resolve('zeit'), ms))]);
    }

    function loeschen(){
      knopf.disabled = true;
      trotzdem.hidden = true;
      status.textContent = 'Lösche …';
      return Speicher.allesLoeschen().then(() => {
        inhalt.innerHTML = '';
        inhalt.appendChild(el('section', { klasse: 'panel' }, [
          el('h1', { text: '✓ Gelöscht' }),
          el('p', { text: 'Auf diesem iPad ist nichts mehr von euch gespeichert. Danke fürs Mitmachen! Gebt das iPad jetzt zurück.' })
        ]));
      }).catch(err => {
        console.error(err);
        status.textContent = '⚠ Löschen hat nicht geklappt. Schließt alle anderen Safari-Tabs (unten rechts: Tabs, dann wegwischen) und tippt nochmal.';
        knopf.disabled = false;
      });
    }

    function beschreiben(e){
      if(e.art === 'ereignis') return (e.ereignis === 'beendet' ? 'Station ' : e.ereignis + ' ') + (e.station || '');
      if(e.art === 'datei') return 'Foto ' + (e.station || '');
      return e.sorte || 'Stempel';
    }

    knopf.addEventListener('click', () => {
      knopf.disabled = true;
      trotzdem.hidden = true;
      status.textContent = 'Prüfe, ob alles beim Laptop ist … (höchstens 20 Sekunden)';
      hoechstens(Outbox.abarbeiten(), 20000)
        .then(() => hoechstens(Speicher.outboxAlle(), 5000))
        .then(eintraege => {
          const offene = eintraege === 'zeit' ? null : eintraege.filter(e => !e.gesendet);
          if(offene && !offene.length){
            if(!confirm('Wirklich alles auf diesem iPad löschen?')){
              status.textContent = '';
              knopf.disabled = false;
              return;
            }
            return loeschen();
          }
          status.textContent = offene
            ? '⚠ ' + offene.length + (offene.length === 1 ? ' Sache ist' : ' Sachen sind') + ' noch nicht beim Laptop (' + offene.slice(0, 3).map(beschreiben).join(', ') + (offene.length > 3 ? ' …' : '') + '). Wartet kurz und tippt nochmal. Klappt es nicht: Sagt Penny Bescheid.'
            : '⚠ Der Speicher des iPads antwortet nicht. Tippt nochmal oder sagt Penny Bescheid.';
          knopf.disabled = false;
          trotzdem.hidden = false;
        })
        .catch(err => {
          console.error(err);
          status.textContent = '⚠ Prüfen hat nicht geklappt. Sagt Penny Bescheid.';
          knopf.disabled = false;
          trotzdem.hidden = false;
        });
    });
    trotzdem.addEventListener('click', () => {
      if(confirm('Noch nicht alles ist beim Laptop. Trotzdem alles löschen?')) loeschen();
    });
    box.appendChild(knopf);
    box.appendChild(status);
    box.appendChild(trotzdem);
    return box;
  }

  function zeitenAusFortschritt(f){
    const zeiten = {};
    Object.keys(f.stationen || {}).forEach(id => {
      const e = f.stationen[id] || {};
      if(!e.start && !e.ende) return;
      const min = e.start && e.ende ? (new Date(e.ende) - new Date(e.start)) / 60000 : null;
      zeiten[id] = { start: e.start, ende: e.ende, minuten: min != null && min >= 0 ? min : null };
    });
    return zeiten;
  }

  function ipadTeil(gruppe, liste, f){
    const box = el('section', { klasse: 'panel' }, [
      el('h1', { text: '📱 Auf diesem iPad' }),
      el('p', { klasse: 'hinweis', text: 'Das bleibt auf dem iPad, bis Penny es nach dem Workshop zurücksetzt. Andere iPads sehen es nicht.' }),
      el('p', {}, [el('strong', { text: 'Eure Namen: ' }), el('span', { text: gruppe.personen.join(' und ') })]),
      el('p', { text: Stationen.anzahlFertig(liste, f) + ' von ' + Stationen.anzahlPflicht(liste) + ' Stationen geschafft.' }),
      el('h2', { text: 'Wann ihr wo wart' }),
      zeitTabelle(liste, zeitenAusFortschritt(f))
    ]);
    // Erst auf Knopfdruck: Alle Fotos auf einmal zu lesen, belastet alte iPads und hält den Speicher auf
    box.appendChild(el('h2', { text: 'Fotos und Bilder' }));
    box.appendChild(el('p', { klasse: 'hinweis', text: 'Hier sind auch Fotos dabei, die ihr verworfen habt. Die gehen nicht an den Laptop.' }));
    const zeigen = el('button', { type: 'button', klasse: 'secondary', text: 'Fotos auf dem iPad anzeigen' });
    zeigen.addEventListener('click', () => {
      zeigen.disabled = true;
      zeigen.textContent = 'Lade …';
      Speicher.dateienAlle().then(dateien => {
        const fotos = dateien.filter(d => d && /^image\//.test(d.typ));
        zeigen.replaceWith(fotos.length ? bilder(fotos.map(d => URL.createObjectURL(new Blob([d.daten], { type: d.typ })))) : el('p', { text: 'Keine.' }));
      }).catch(err => {
        console.error(err);
        zeigen.textContent = 'Fotos konnten nicht geladen werden';
      });
    });
    box.appendChild(zeigen);
    return box;
  }

  Promise.all([Speicher.lesen('gruppe'), Stationen.laden().catch(() => []), Stationen.fortschritt()])
    .then(werte => {
      const gruppe = werte[0];
      inhalt.innerHTML = '';
      if(!gruppe){
        inhalt.appendChild(el('section', { klasse: 'panel' }, [el('h1', { text: 'Meine Daten' }),
          el('p', { text: 'Auf diesem iPad ist niemand angemeldet. Darum ist hier auch nichts gespeichert.' }),
          el('a', { klasse: 'knopf-link', href: '/', text: 'Zur Startseite' })]));
        return;
      }
      inhalt.appendChild(el('section', { klasse: 'panel' }, [
        el('h1', { text: '🔒 Meine Daten' }),
        el('p', { text: 'Hier siehst du alles, was über ' + (gruppe.personen.length === 2 ? 'euch' : 'dich') + ' gespeichert ist. Wenn dir etwas komisch vorkommt: Frag Penny.' }),
        el('a', { klasse: 'knopf-link', href: '/', text: '← Zurück' })
      ]));
      inhalt.appendChild(ipadTeil(gruppe, werte[1], werte[2]));
      inhalt.appendChild(laptopTeil(gruppe, werte[1]));
      inhalt.appendChild(auswertenTeil(werte[1], werte[2]));
      const platz = el('div');
      inhalt.appendChild(platz);
      fetch('/api/einstellungen', { cache: 'no-store' }).then(r => r.json())
        .then(e => (e.freigaben || []).indexOf('loeschen') >= 0)
        .catch(() => false)
        .then(frei => { if(frei || /[?&]test/.test(location.search)) platz.appendChild(loeschenTeil()); });
    })
    .catch(err => Rahmen.fehler('Meine Daten konnten nicht geladen werden.', err));
})();
</script>
</body>
</html>
